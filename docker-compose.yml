services:
  backend:
    build:
      context: ./backend
    image: ghcr.io/goldbergz/film-react-nest-backend:latest
    env_file: .env
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - '3000'
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - film-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/afisha}
        VITE_CDN_URL: ${VITE_CDN_URL:-/content/afisha}
    image: ghcr.io/goldbergz/film-react-nest-frontend:latest
    volumes:
      - frontend-dist:/static
    restart: unless-stopped
    networks:
      - film-network

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/goldbergz/film-react-nest-nginx:latest
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - film-network

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - film-network

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '${PGADMIN_PORT:-8080}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - film-network

networks:
  film-network:

volumes:
  db-data:
  pgadmin-data:
  frontend-dist:
